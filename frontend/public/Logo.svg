<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <defs>
    <!-- Tło w stylu deep tech/dark mode -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Gradient Hossy (Neon Green -> Mint -> Cyan) -->
    <linearGradient id="hossaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gradient cieczy w kolbie laboratoryjnej -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.95" />
    </linearGradient>

    <!-- Poświata neonowa (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ramka i ciemne tło aplikacji -->
  <rect width="520" height="520" rx="100" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="2.5"/>

  <!-- Tło analityczne: subtelna siatka wykresu laboratoryjnego -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1.5">
    <line x1="90" y1="130" x2="430" y2="130" stroke-dasharray="4 4"/>
    <line x1="90" y1="190" x2="430" y2="190" stroke-dasharray="4 4"/>
    <line x1="90" y1="250" x2="430" y2="250" stroke-dasharray="4 4"/>
    <line x1="90" y1="310" x2="430" y2="310" stroke-dasharray="4 4"/>
    <line x1="160" y1="90" x2="160" y2="340" />
    <line x1="260" y1="90" x2="260" y2="340" />
    <line x1="360" y1="90" x2="360" y2="340" />
  </g>

  <!-- ================= IKONA GŁÓWNA: KOLBA + HOSSA ================= -->
  <g transform="translate(0, -10)">
    <!-- Ciecz wewnątrz kolby (reakcja giełdowa) -->
    <path d="M 200 245 L 165 305 C 158 317 167 332 181 332 L 339 332 C 353 332 362 317 355 305 L 320 245 Z" 
          fill="url(#liquidGrad)" opacity="0.28" />

    <!-- Pęcherzyki / cząstki kwantowe w probówce -->
    <circle cx="230" cy="290" r="4.5" fill="#34D399" opacity="0.6"/>
    <circle cx="285" cy="275" r="3.5" fill="#34D399" opacity="0.8"/>
    <circle cx="255" cy="310" r="5" fill="#06B6D4" opacity="0.5"/>
    <circle cx="295" cy="305" r="3" fill="#10B981" opacity="0.7"/>

    <!-- Szklany obrys kolby laboratoryjnej -->
    <!-- Szyjka, podziałka laboratoryjna i podstawa -->
    <path d="M 235 155 L 285 155 M 240 155 L 240 200 L 160 325 C 150 341 162 355 180 355 L 340 355 C 358 355 370 341 360 325 L 280 200 L 280 155" 
          fill="none" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Miarka / Skala laboratoryjna na ściance kolby -->
    <line x1="238" y1="245" x2="252" y2="245" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="223" y1="270" x2="243" y2="270" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="205" y1="295" x2="230" y2="295" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Świece giełdowe wznoszące się wewnątrz i wybijające w górę -->
    <!-- Świeca 1 (niska) -->
    <line x1="215" y1="270" x2="215" y2="320" stroke="#10B981" stroke-width="2.5"/>
    <rect x="209" y="280" width="12" height="28" rx="2.5" fill="#10B981"/>

    <!-- Świeca 2 (przełamująca) -->
    <line x1="260" y1="205" x2="260" y2="280" stroke="#10B981" stroke-width="3"/>
    <rect x="253" y="220" width="14" height="42" rx="3" fill="#10B981" filter="url(#neonGlow)"/>

    <!-- Dynamiczny wykres Hossy wybity wprost z kolby (Breakout) -->
    <path d="M 215 295 L 260 235 L 295 255 L 365 140 L 405 150 M 365 140 L 360 180" 
          fill="none" stroke="url(#hossaGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

    <!-- Główna świeca breakoutowa na szczycie trendu -->
    <line x1="365" y1="105" x2="365" y2="195" stroke="#00F5A0" stroke-width="3"/>
    <rect x="357" y="125" width="16" height="50" rx="3" fill="#00F5A0" filter="url(#softGlow)"/>

    <!-- Węzły analityczne AI na załamaniach linii -->
    <circle cx="260" cy="235" r="5" fill="#FFFFFF"/>
    <circle cx="295" cy="255" r="5" fill="#FFFFFF"/>
    <circle cx="365" cy="140" r="6.5" fill="#00F5A0" filter="url(#neonGlow)"/>
  </g>

  <!-- ================= TYPOGRAFIA BRANDINGOWA ================= -->
  <text x="260" y="425" text-anchor="middle" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="3" fill="#F8FAFC">
    HOSSA<tspan fill="url(#hossaGrad)">LAB</tspan>
  </text>
  
  <text x="260" y="455" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="600" font-size="12" letter-spacing="7" fill="#64748B">
    AI QUANT RESEARCH
  </text>
</svg>
